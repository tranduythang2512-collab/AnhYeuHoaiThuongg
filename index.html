<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cosmic Particle Heart - Hold & Burst 💖</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- File CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="relative flex items-center justify-center">

    <!-- WebGL Canvas cho Trái tim 3D -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Vòng năng lượng khi nhấn giữ -->
    <div id="energy-ring" class="hold-ring w-32 h-32 opacity-0"></div>

    <!-- UI Overlay Controls -->
    <div class="relative z-20 w-full h-full pointer-events-none flex flex-col justify-between p-4 md:p-8">
        
        <!-- Header Section -->
        <div class="flex items-center justify-between w-full max-w-5xl mx-auto pointer-events-auto">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-pink-500/20 flex items-center justify-center border border-pink-500/40">
                    <i class="fa-solid fa-heart text-pink-400 text-lg"></i>
                </div>
                <div>
                    <h1 class="font-love text-2xl md:text-3xl font-bold bg-gradient-to-r from-pink-400 via-rose-300 to-purple-400 bg-clip-text text-transparent">
                        Cosmic Love Space
                    </h1>
                    <p class="text-[10px] text-pink-200/60 uppercase tracking-widest">Chạm & Nhấn giữ trái tim để bùng nổ</p>
                </div>
            </div>

            <!-- Nút Nhạc & Bùng Nổ Nhanh -->
            <div class="flex items-center gap-3">
                <button onclick="triggerManualBurst()" class="glass-card px-4 py-2 rounded-full border border-pink-500/30 text-xs font-semibold text-pink-200 hover:bg-pink-500/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i> Bùng Nổ
                </button>

                <div class="flex items-center gap-2 glass-card px-3 py-1.5 rounded-full border border-pink-500/30">
                    <!-- ĐƯỜNG DẪN ĐÃ ĐƯỢC CẬP NHẬT CHÍNH XÁC THEO HÌNH -->
                    <audio id="bg-audio" loop src="audio/snaptik.vn_7675330505969093895.mp3"></audio>
                    <button onclick="toggleMusic()" id="play-btn" class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 flex items-center justify-center text-white text-xs shadow-lg hover:scale-105 transition active:scale-95">
                        <i class="fa-solid fa-play ml-0.5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Center Guide Prompt -->
        <div id="guide-prompt" class="text-center my-auto transition-opacity duration-700 pointer-events-none">
            <p class="font-love text-3xl md:text-5xl text-pink-200 drop-shadow-[0_0_15px_rgba(255,75,114,0.9)] animate-pulse">
                💖 Nhấn & Giữ Chuột / Cảm Ứng 💖
            </p>
            <p class="text-xs text-pink-300/80 mt-2 uppercase tracking-widest font-semibold">
                Để kích hoạt năng lượng tình yêu bùng nổ
            </p>
        </div>

        <!-- Footer Info -->
        <div class="text-center text-[11px] text-pink-300/50 uppercase tracking-widest font-semibold">
            Mãi Yêu Em ❤️ Particle Universe Hold & Burst Engine
        </div>
    </div>

    <!-- Canvas 2D cho hiệu ứng hạt pháo hoa trái tim -->
    <canvas id="burst-canvas" class="fixed inset-0 pointer-events-none z-10"></canvas>

    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- File JS riêng -->
    <script src="script.js"></script>
</body>
</html>
